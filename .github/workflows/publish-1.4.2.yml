name: Publish verified Magic Hub 1.4.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.4.2.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve approved signed artifact
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2934-8210-a104-2ec3cc928dd3/raw?se=2026-11-26T14%3A16%3A17Z&sp=r&sv=2026-06-06&sr=b&scid=a8731d92-29bc-50fd-a8be-ad90ea3de9d8&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-25T23%3A37%3A54Z&ske=2026-11-26T23%3A37%3A54Z&sks=b&skv=2026-06-06&sig=h4i6ddl0sOwbKv3770BW%2BWA0b0X9nVqRS4JYRezjTmc%3D'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ARTIFACT_URL" -o approved.zip
          echo '118b406ee9c49e04f00119b73038d870d2ee9b0f5084357799ef93228c969c91  approved.zip' | sha256sum -c -
          mkdir dist
          unzip -q approved.zip -d dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          test -f Magic-Hub-1.4.2-release.apk
      - name: Publish approved APK and bilingual release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite'
            exit 1
          fi
          gh release create v1.4.2 dist/Magic-Hub-1.4.2-release.apk dist/Magic-Hub-1.4.2-certificate.pem dist/SHA256SUMS.txt dist/APK-VERSION.txt dist/APK-SIGNATURE-VERIFICATION.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Magic Hub 1.4.2 — Public Beta' --notes-file RELEASE_NOTES_1.4.2.md --prerelease --latest=false
